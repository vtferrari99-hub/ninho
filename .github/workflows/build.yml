name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Compilar
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log

      - name: Erros de compilação (anotações)
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE|What went wrong" -A3 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done

      - name: Preparar APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/Ninho-teste.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Ninho-teste
          path: out/Ninho-teste.apk

      - name: Publicar no branch builds
        run: |
          cd out
          git init -q
          git config user.name "ninho-ci"
          git config user.email "ci@coffeelabs.com.br"
          git checkout -q -b builds
          git add Ninho-teste.apk
          git commit -qm "APK de teste ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" builds
